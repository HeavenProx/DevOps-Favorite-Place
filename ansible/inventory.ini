[managers]
# Container name = "swarm-manager-1" (project name "swarm" from the swarm/ subfolder)
# This inventory is static and expects the worker scale to remain fixed.
swarm-manager-1

[managers:vars]
ansible_connection=community.docker.docker

[workers]
# This inventory is hardcoded for exactly three worker containers.
# Start the cluster with `docker compose up -d --scale node=3`.
# If you choose a different scale, update this inventory to match.
swarm-node-1
swarm-node-2
swarm-node-3

[workers:vars]
ansible_connection=community.docker.docker
